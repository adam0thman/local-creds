<!doctype html>
<meta charset="utf-8">
<title>creds</title>
<style>
  :root { color-scheme: light dark; --bd:#8883; --dim:#8888; --bad:#c0392b; }
  body { font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         width:320px; margin:0; padding:10px 12px; }
  h1 { font-size:12px; text-transform:uppercase; letter-spacing:.06em;
       color:var(--dim); margin:0 0 2px; font-weight:600; }
  .origin { font-family:ui-monospace,Menlo,monospace; font-size:11px;
            color:var(--dim); word-break:break-all; margin:0 0 10px; }
  .hit { border:1px solid var(--bd); border-radius:7px; padding:8px 9px; margin-bottom:7px; }
  .id { font-family:ui-monospace,Menlo,monospace; font-size:12px; word-break:break-all; }
  .who { color:var(--dim); font-size:11.5px; margin:2px 0 7px; }
  .env { display:inline-block; border:1px solid var(--bd); border-radius:4px;
         padding:0 4px; font-size:10px; text-transform:uppercase; margin-left:5px; }
  .prod { border-color:var(--bad); color:var(--bad); font-weight:700; }
  .btns { display:flex; gap:6px; }
  button { font:inherit; padding:3px 11px; border:1px solid var(--bd);
           border-radius:5px; background:transparent; cursor:pointer; }
  button:hover { border-color:var(--dim); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { border-color:currentColor; font-weight:600; }
  .note { font-size:11.5px; color:var(--dim); margin:7px 0 0; }
  .note.err { color:var(--bad); }
  .warn { color:var(--bad); font-size:11.5px; margin:0 0 6px; }
  .empty, .err { color:var(--dim); }
  .err { color:var(--bad); }
  ul { margin:4px 0 0 16px; padding:0; }
</style>
<h1>creds</h1>
<p class="origin" id="origin">…</p>
<div id="out"></div>
<script src="popup.js"></script>
